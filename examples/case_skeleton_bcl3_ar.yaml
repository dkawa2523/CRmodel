plasma_mode: te
emission_mode: empirical

gas_mixture:
  total_pressure_Pa: 3.0
  gas_temperature_K: 400.0
  fractions:
    Ar: 0.05
    BCl3: 0.95

energy_grid:
  min_eV: 0.0
  max_eV: 150.0
  n_points: 800

geometry:
  mode: axisym_shell
  chamber_radius_m: 0.15
  chamber_height_m: 0.08
  z_m: 0.035
  chord_r_m: [0.00, 0.02, 0.04, 0.06, 0.08]
  n_shells: 3

plasma_state:
  te_eedf_kind: maxwell
  ne_shells_m3: [1.0e16, 8.0e15, 6.0e15]
  te_shells_eV: [2.5, 2.2, 2.0]
  metastables: {Ar_1s5: [5.0e14, 4.0e14, 2.0e14]}
  radicals: {F: [1.0e19, 8.0e18, 6.0e18], Cl: [1.0e19, 8.0e18, 6.0e18], B: [5.0e17, 4.0e17, 3.0e17], BCl: [5.0e17, 4.0e17, 3.0e17]}

residuals:
  mode: custom
  species_density_m3: {H2O: 0.0, N2: 0.0, O2: 0.0, CO: 0.0, CO2: 0.0, H2: 0.0}

wall:
  priors:
    gamma_O: {type: loguniform, min: 1.0e-5, max: 1.0e-1}
    gamma_Ar_meta: {type: loguniform, min: 1.0e-4, max: 1.0e-1}
  gamma:
    O: 1.0e-3
    Ar: 5.0e-3

states:
  - id: Ar_2p1
    species: Ar
    energy_eV: 13.48
    mass_amu: 39.948
    solve: true

reactions:
  - id: exc_Ar_to_2p1
    kind: electron_excitation
    source_state: Ar
    target_state: Ar_2p1
    cross_section_file: data/cross_section_templates/ar/Ar_ground_to_4p_2p1_template.csv

transitions:
  - id: Ar750
    upper: Ar_2p1
    lower: Ar_1s2
    wavelength_nm: 750.386
    A_s-1: 4.5e7
    profile: {kind: gaussian, fwhm_nm: 0.03}

bands:
  - id: BCl272
    kind: effective_excitation_band
    source_density_key: BCl
    cross_section_file: data/cross_section_templates/bcl3/BCl_272_effective_template.csv
    center_nm: 272.0
    fwhm_nm: 8.0
    amplitude_scale: 1.0
    profile_kind: gaussian
  - id: B209
    kind: effective_excitation_band
    source_density_key: B
    cross_section_file: data/cross_section_templates/bcl3/BI_209_effective_template.csv
    center_nm: 208.957
    fwhm_nm: 1.8
    amplitude_scale: 1.0
    profile_kind: gaussian
  - id: B250
    kind: effective_excitation_band
    source_density_key: B
    cross_section_file: data/cross_section_templates/bcl3/BI_250_effective_template.csv
    center_nm: 249.724
    fwhm_nm: 2.2
    amplitude_scale: 1.0
    profile_kind: gaussian


diagnostics:
  window_registry: diagnostics/windows_ar_nf3_cl2_bcl3_curated.yaml

instruments:
  - id: uvvis_lowres
    yaml_file: instruments/uvvis_lowres.yaml
