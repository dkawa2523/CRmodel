plasma_mode: te
emission_mode: physical
metadata:
  benchmark_role: synthetic common-state recovery
  interpretation: same-model self-consistency using effective Cl emitter curves; not external physical validation

gas_mixture:
  total_pressure_Pa: 2.4
  gas_temperature_K: 400.0
  fractions:
    Ar: 0.78
    Cl2: 0.22

energy_grid:
  min_eV: 0.0
  max_eV: 60.0
  n_points: 601

geometry:
  mode: axisym_shell
  chamber_radius_m: 0.05
  chamber_height_m: 0.08
  z_m: 0.0
  chord_r_m: [0.0]
  n_shells: 1

plasma_state:
  te_eedf_kind: maxwell
  ne_shells_m3: [1.6e16]
  te_shells_eV: [4.0]
  metastables: {}
  radicals:
    Cl: [2.0e19]

residuals:
  mode: "off"
  species_density_m3: {}

wall:
  gamma: {}
  priors: {}

species_packs:
  - yaml_file: ../../data/species_packs/ar_2p1_2p6_nist.yaml
  - yaml_file: ../../data/species_packs/cl_effective_lines.yaml

states: []
reactions:
  - id: exc_Ar_to_2p1
    kind: electron_excitation
    source_state: Ar
    target_state: Ar_2p1
    cross_section_file: ../../data/cross_sections_curated/ar/Ar_ground_to_4p_2p1_curated.csv
  - id: exc_Ar_to_2p6
    kind: electron_excitation
    source_state: Ar
    target_state: Ar_2p6
    cross_section_file: ../../data/cross_sections_curated/ar/Ar_ground_to_4p_2p6_curated.csv
transitions: []
bands: []

diagnostics:
  window_registry: null
  quality:
    enabled: true
    on_error: report
  convergence:
    enabled: false

instruments:
  - &line_instrument
    id: cl725
    wavelength_min_nm: 723.7
    wavelength_max_nm: 727.7
    bin_nm: 0.2
    throughput: 1.0
    lsf: {kind: gaussian, fwhm_nm: 0.35}
    baseline: {kind: constant, offset: 0.0}
    nuisance: {gain: 1.0, wavelength_shift_nm: 0.0}
    calibration: &absolute_calibration
      kind: spectral_radiance
      absolute: true
      input_basis: spectral_radiance
      output_unit: W_m-2_sr-1_nm-1
      reference: Synthetic identity calibration for common-state benchmark
      relative_standard_uncertainty: 0.01
  - <<: *line_instrument
    id: ar750
    wavelength_min_nm: 748.4
    wavelength_max_nm: 752.4
  - <<: *line_instrument
    id: cl755
    wavelength_min_nm: 752.7
    wavelength_max_nm: 756.7
  - <<: *line_instrument
    id: ar763
    wavelength_min_nm: 761.5
    wavelength_max_nm: 765.5
  - <<: *line_instrument
    id: ar800
    wavelength_min_nm: 798.6
    wavelength_max_nm: 802.6
  - <<: *line_instrument
    id: cl822
    wavelength_min_nm: 820.2
    wavelength_max_nm: 824.2
  - <<: *line_instrument
    id: ar922
    wavelength_min_nm: 920.4
    wavelength_max_nm: 924.4
