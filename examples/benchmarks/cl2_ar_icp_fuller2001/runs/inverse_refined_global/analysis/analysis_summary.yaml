plasma_oes_findings:
- Dominant measured features are ClII_481_986 (ionic_line, area ratio 1.05), ArII_480_602
  (ionic_line, area ratio 0.96), ClI_822_200_interference (atomic_line_with_interference,
  area ratio 1.06).
- The inverse solution reduces the objective cost by 2.2% relative to the initial
  state.
- The truth case remains within the same cost basin as the fitted case, so the fit
  is consistent with the benchmark physics under noise.
- Parameter recovery against the benchmark truth is weak for ne, te, Cl, Cl2e; spectral
  agreement is being achieved mainly through shape matching rather than absolute emissivity
  recovery.
- 'Recovered radial trends are ne: non-monotonic radial structure, te: monotonic decrease
  from core to edge, Cl: monotonic decrease from core to edge, Cl2e: non-monotonic
  radial structure.'
measurement_engineering_findings:
- cl2_benchmark_scan covers 270.0-885.0 nm with 0.200 nm sampling and uses 6 analysis
  windows.
- Fitted gain spans 1.135-1.135 with negligible offsets (max abs offset 4.690e-16).
- Mean absolute peak shift across narrow features is 0.088 nm, which is the practical
  wavelength-alignment indicator for the current inverse workflow.
- The least constrained fitted quantities are ne2 (136.3% rel.), ne1 (135.3% rel.),
  ne0 (21.8% rel.), te2 (2.0% rel.).
forward_plasma_oes_findings:
- Initial forward mismatch is dominated by ClII_481_986 (1.06), ArII_480_602 (0.96),
  ClI_822_200_interference (0.96).
- Truth-forward agreement is dominated by ClII_481_986 (1.06), ArII_480_602 (0.95),
  ClI_822_200_interference (0.97).
- Truth-forward stays in the same spectral basin as init; objective change is -0.5%
  and mean correlation changes by 0.0000.
- Broad or structured windows with residual shape/centroid mismatch remain in Cl2_band_306,
  indicating profile/baseline sensitivity rather than simple line-intensity error.
forward_measurement_engineering_findings:
- Mean gain needed to align init-forward is 1.136, while truth-forward needs 0.937;
  the ratio 1.21 is the practical absolute-calibration mismatch indicator.
- Truth-forward mean NRMSE/std is 0.2202 versus 0.2195 for init-forward.
