inference_mode: relative_shape

measurements:
  - instrument_id: cl2_benchmark_scan
    files_glob: measurements/chord_*.csv

fit:
  objective:
    spectrum_weight: 1.0
    window_fit_weight: 0.35
    window_fit_normalization: area
    window_baseline_mode: local_linear
    area_weight: 0.85
    peak_weight: 0.12
    auto_gain_fit: true
    auto_offset_fit: true
    auto_gain_tilt_fit: false
    auto_gain_scope: instrument
    gain_prior_weight: 0.05
    gain_prior_sigma_log10: 0.15
    gain_tilt_prior_weight: 0.05
    gain_tilt_prior_sigma: 0.25
    window_ratio_weight: 0.0
    window_ratio_metric: peak
    window_ratio_reference: ClII_481_986
    window_ratio_min_relative_signal: 0.02
    window_min_relative_signal: 0.02
    window_ratio_pairs:
      - name: ClII_over_XeI
        numerator: ClII_481_986
        denominator: XeI_828_012
        metric: peak
        min_relative_signal: 0.09
        weight: 0.24
      - name: ClI_over_XeI
        numerator: ClI_822_200_interference
        denominator: XeI_828_012
        metric: peak
        min_relative_signal: 0.02
        weight: 0.20
      - name: ArII_over_ClII
        numerator: ArII_480_602
        denominator: ClII_481_986
        metric: peak
        min_relative_signal: 0.02
        weight: 0.1
      - name: Cl2band_over_ClI
        numerator: Cl2_band_306
        denominator: ClI_822_200_interference
        metric: area
        min_relative_signal: 0.02
        weight: 0.14
  global:
    enabled: true
    maxiter: 14
    popsize: 10
    seed: 2
  local:
    enabled: true
    max_nfev: 160
  uncertainty:
    laplace: true
  regularization:
    smooth_arrays:
      - path: plasma_state.radicals.Cl
        order: 2
        weight: 0.03

parameter_groups:
  - template: shell_array
    name_prefix: Cl
    path: plasma_state.radicals.Cl
    scale: log
    bounds: [2.0e18, 4.0e19]
  - template: shell_array
    name_prefix: Cl2e
    path: plasma_state.radicals.Cl2_emit
    scale: log
    bounds: [1.0e18, 2.0e19]

priors:
  - type: log_gaussian
    path: plasma_state.radicals.Cl
    mean_log10: [19.146128035678238, 19.041392685158225, 18.89209460269048]
    sigma_log10: 0.16
  - type: log_gaussian
    path: plasma_state.radicals.Cl2_emit
    mean_log10: [18.8750612633917, 18.763427993562937, 18.6232492903979]
    sigma_log10: 0.18
