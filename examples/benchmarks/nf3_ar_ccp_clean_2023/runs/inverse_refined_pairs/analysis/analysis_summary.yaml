plasma_oes_findings:
- Dominant measured features are N2_FP_550_700 (broadband_window, area ratio -1.02),
  FI_685_603 (atomic_line, area ratio 1.07), FI_703_747 (atomic_line, area ratio 1.08).
- The inverse solution reduces the objective cost by 9.5% relative to the initial
  state.
- The truth case remains within the same cost basin as the fitted case, so the fit
  is consistent with the benchmark physics under noise.
- Parameter recovery against the benchmark truth is weak for ne, te, F, N2e; spectral
  agreement is being achieved mainly through shape matching rather than absolute emissivity
  recovery.
- 'Recovered radial trends are ne: non-monotonic radial structure, te: monotonic decrease
  from core to edge, F: non-monotonic radial structure, N2e: non-monotonic radial
  structure.'
measurement_engineering_findings:
- nf3_benchmark_uvvis covers 300.0-820.0 nm with 0.500 nm sampling and uses 7 analysis
  windows.
- Fitted gain spans 0.777-0.777 with negligible offsets (max abs offset 1.055e-17).
- Mean absolute peak shift across narrow features is 0.320 nm, which is the practical
  wavelength-alignment indicator for the current inverse workflow.
- Signed window-area ratios can become negative for broad bands when local baseline
  subtraction dominates the integrated residual; treat those entries as a baseline-sensitivity
  flag rather than a literal negative emissivity.
- The least constrained fitted quantities are N2e0 (49.3% rel.), ne0 (20.8% rel.),
  N2e2 (17.6% rel.), F1 (13.3% rel.).
forward_plasma_oes_findings:
- Initial forward mismatch is dominated by N2_FP_550_700 (-1.01), FI_685_603 (1.11),
  FI_703_747 (1.12).
- Truth-forward agreement is dominated by N2_FP_550_700 (-1.01), FI_685_603 (1.07),
  FI_703_747 (1.07).
- Truth-forward reduces the forward-only objective by 13.4% and increases mean correlation
  by 0.0004.
- Broad or structured windows with residual shape/centroid mismatch remain in N2_SPS_300_400,
  indicating profile/baseline sensitivity rather than simple line-intensity error.
forward_measurement_engineering_findings:
- Mean gain needed to align init-forward is 4.094, while truth-forward needs 1.040;
  the ratio 3.93 is the practical absolute-calibration mismatch indicator.
- Truth-forward mean NRMSE/std is 0.1564 versus 0.1679 for init-forward.
- Negative signed area ratios on broad windows should be interpreted as local-baseline
  sensitivity in the integration window, not as negative physical emission.
