
plasma_mode: te
emission_mode: empirical

gas_mixture:
  total_pressure_Pa: 5.0
  gas_temperature_K: 400.0
  fractions:
    Ar: 0.15
    CF4: 0.70
    O2: 0.15

energy_grid:
  min_eV: 0.0
  max_eV: 40.0
  n_points: 700

geometry:
  mode: axisym_shell
  chamber_radius_m: 0.15
  chamber_height_m: 0.08
  z_m: 0.035
  chord_r_m: [0.00, 0.02, 0.04, 0.06, 0.08]
  n_shells: 3

plasma_state:
  te_eedf_kind: maxwell
  ne_shells_m3: [1.8e16, 1.4e16, 1.0e16]
  te_shells_eV: [2.6, 2.2, 1.8]
  metastables:
    Ar_1s5: [7.0e14, 5.0e14, 3.0e14]
  radicals:
    CF: [8.0e17, 6.0e17, 4.0e17]
    CF2: [1.3e18, 1.0e18, 7.0e17]
    O: [9.0e18, 6.0e18, 4.0e18]
    Cl: [0.0, 0.0, 0.0]
    F: [1.5e19, 1.2e19, 9.0e18]

residuals:
  mode: custom
  species_density_m3:
    H2O: 0.0
    N2: 0.0
    CO: 0.0
    CO2: 0.0
    H2: 0.0

wall:
  priors:
    gamma_O:
      type: loguniform
      min: 1.0e-5
      max: 1.0e-1
    gamma_Ar_meta:
      type: loguniform
      min: 1.0e-4
      max: 1.0e-1
  gamma:
    O: 1.0e-3
    Ar: 5.0e-3

species_packs:
  - yaml_file: data/species_packs/ar_2p1_2p6_nist.yaml
  - yaml_file: data/species_packs/o_777_reduced.yaml
    namespace: oxygen

states: []

reactions:
  - id: exc_Ar_to_2p1
    kind: electron_excitation
    source_state: Ar
    target_state: Ar_2p1
    cross_section_file: data/cross_sections/Ar_to_2p1.csv
  - id: exc_Ar_to_2p6
    kind: electron_excitation
    source_state: Ar
    target_state: Ar_2p6
    cross_section_file: data/cross_sections/Ar_to_2p6.csv
  - id: step_Ar1s5_to_2p1
    kind: electron_excitation
    source_state: Ar_1s5
    target_state: Ar_2p1
    cross_section_file: data/cross_sections/Ar1s5_to_2p1.csv
  - id: step_Ar1s5_to_2p6
    kind: electron_excitation
    source_state: Ar_1s5
    target_state: Ar_2p6
    cross_section_file: data/cross_sections/Ar1s5_to_2p6.csv
  - id: quench_Ar_2p1_by_O2
    kind: two_body
    source_state: Ar_2p1
    colliders: [O2]
    coefficient_m3_s: 1.5e-16
  - id: quench_Ar_2p6_by_O2
    kind: two_body
    source_state: Ar_2p6
    colliders: [O2]
    coefficient_m3_s: 1.5e-16
transitions: []

bands:
  - id: CF_202
    kind: effective_excitation_band
    source_density_key: CF
    cross_section_file: data/cross_sections/CF_eff_202.csv
    center_nm: 202.4
    fwhm_nm: 6.0
    amplitude_scale: 1.0e-6
    profile_kind: gaussian
  - id: CF2_252
    kind: effective_excitation_band
    source_density_key: CF2
    cross_section_file: data/cross_sections/CF2_eff_252.csv
    center_nm: 251.9
    fwhm_nm: 8.0
    amplitude_scale: 1.0e-6
    profile_kind: gaussian

diagnostics:
  window_registry: diagnostics/windows.yaml

instruments:
  - id: uvvis_lowres
    yaml_file: instruments/uvvis_lowres.yaml
