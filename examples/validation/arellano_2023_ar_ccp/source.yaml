atomic_model_assessment:
  evaluator: scripts/assess_arellano_atomic_model.py
  purpose: diagnostic sensitivity only; no validation verdict
  artifact:
    file: atomic_model_assessment.json
    sha256: ded0452fe27a053a34cc6469543a39f43659d8deff5b4d5c1a4b59d8575870fd
  energy_grid: {min_eV: 0.0, max_eV: 300.0, n_points: 30001}
  mean_energy_eV: [3.0, 4.5, 6.0, 7.5, 9.0, 12.0]
  eedf_families: [maxwellian, druyvesteyn]
  threshold_bases: [native_model, nist_level_energy]
  assumptions:
    - direct ground-state excitation only
    - corona balance with all NIST radiative branches
    - BSR-500 and NGFSRDW are treated as independent direct-excitation model families
    - EEDF families compared at equal mean energy
    - neutral-Ar quenching is evaluated as a separate state-specific loss sensitivity
    - the monoenergetic cascade anchor is reported separately and is not applied to EEDF-integrated predictions
    - no stepwise excitation or radiation trapping
