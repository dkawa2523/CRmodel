limitations:
  - The plotted ratio has relative spectral-response correction but no absolute intensity calibration.
  - The source does not report quantitative uncertainty for the plotted ratio.
  - The source data are request-only; the packaged values are vector-digitized.
  - General example Ar excitation cross sections remain effective seeds and are not validation-grade state-resolved data.
  - The externally supplied BSR and NGFSRDW curves are independent theoretical references, but neither has source-provided uncertainty.
  - The sparse NGFSRDW curve is a model-discrepancy bound and not an uncertainty-bearing near-threshold benchmark.
  - EEDF and Ar 1s5 density are not independently closed for the full experimental pressure series.
  - This candidate is not counted as validation until its comparator and tolerance are fixed.
