- id: fuller2001_cl2_ar_power_fraction
  priority: P0
  status: source_assessed_raster_digitization_pending
  evidence_kind: external_spectral
  gases: [Cl2, Ar, Ne, Xe]
  source:
    doi: 10.1063/1.1391222
    url: https://doi.org/10.1063/1.1391222
    author_pdf_url: https://www.columbia.edu/~iph1/Download/105.%20Fuller-JAP-90-3182-2001.pdf
    source_pdf_sha256: 8df375068d854eab94fccf382de02d08b179c4c7386826cff7c2e4bc1a85107e
    raw_data_availability: >-
      Published raster figures contain response-corrected integrated emission
      and actinometry-derived densities; no machine-readable full spectrum was
      identified.
  unit_of_independence: argon_fraction_power_condition
  condition_design:
    pressure_mTorr: 18
    argon_fraction_percent: [1, 13, 40, 78, 96]
    power_points: all published points
    fixed_holdout_argon_fraction_percent: [78, 96]
  observables_nm: [306.0, 480.7, 482.0, 585.2, 822.2, 828.0]
  published_derived_quantities:
  - absolute Cl2 density
  - absolute Cl density
  - absolute Cl+ density
  - absolute Ar+ density
  - Cl2 dissociation fraction
  circular_reference_exclusions:
  - OES-derived electron temperature is not independent truth
  - OES/actinometry-derived densities are not independent truth
  limitations:
  - Raster digitization uncertainty must be separate from experimental uncertainty.
  - This source cannot satisfy a measured-versus-predicted full-spectrum gate.
  claim: mixture and power dependence of declared actinometry observables

