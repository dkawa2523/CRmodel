portfolio_version: 1
updated: "2026-10-01"
purpose: >-
  Prioritized external benchmark portfolio for multiple gases, operating
  conditions, spectra, sessions, and independent plasma diagnostics.

claim_policy:
  external_numerical:
    may_support:
    - EEDF import, normalization, interpolation, and rate-integral agreement
    must_not_support:
    - experimental plasma-state accuracy
  external_spectral:
    may_support:
    - held-out spectral shape, line-ratio, interference, and repeatability claims
    must_not_support:
    - Te or ne accuracy without an independent reference
  external_quantitative:
    may_support:
    - only the named quantity, gas, transitions, and operating range
    requires:
    - independently measured reference
    - stated reference uncertainty
    - held-out-only evaluation
    - closed required model inputs

external_tool_boundary:
  rule: >-
    Reference producers run outside the oescr package, import no OESCR code,
    and write immutable result files. The OESCR comparator reads only those
    frozen files and exercises the declared public EEDF/rate calculation path.
  licensed_inputs: >-
    LXCat native downloads and BOLSIG+ executables stay outside version
    control; manifests record source identity, version, hashes, and process IDs.

cases:
