fit:
  objective:
    spectrum_weight: 1.0
    window_fit_weight: 0.45
    window_fit_normalization: area
    window_baseline_mode: local_linear
    area_weight: 0.85
    peak_weight: 0.12
    auto_gain_fit: true
    auto_offset_fit: true
  global:
    enabled: false
    maxiter: 1
    popsize: 4
    seed: 2
    tol: 0.001
  local:
    enabled: true
    max_nfev: 60
  uncertainty:
    laplace: true
  regularization:
    smooth_arrays:
    - path: plasma_state.ne_shells_m3
      order: 2
      weight: 0.05
    - path: plasma_state.te_shells_eV
      order: 2
      weight: 0.05
    - path: plasma_state.radicals.Cl
      order: 2
      weight: 0.03
measurements:
- instrument_id: cl2_benchmark_scan
  files_glob: measurements/chord_*.csv
parameters:
- name: ne0
  path: plasma_state.ne_shells_m3[0]
  scale: log
  bounds: &id001
  - 6000000000000000.0
  - 5.0e+16
- name: ne1
  path: plasma_state.ne_shells_m3[1]
  scale: log
  bounds: *id001
- name: ne2
  path: plasma_state.ne_shells_m3[2]
  scale: log
  bounds: *id001
- name: te0
  path: plasma_state.te_shells_eV[0]
  scale: linear
  bounds: &id002
  - 1.5
  - 6.0
- name: te1
  path: plasma_state.te_shells_eV[1]
  scale: linear
  bounds: *id002
- name: te2
  path: plasma_state.te_shells_eV[2]
  scale: linear
  bounds: *id002
- name: Cl0
  path: plasma_state.radicals.Cl[0]
  scale: log
  bounds: &id003
  - 2.0e+18
  - 4.0e+19
- name: Cl1
  path: plasma_state.radicals.Cl[1]
  scale: log
  bounds: *id003
- name: Cl2
  path: plasma_state.radicals.Cl[2]
  scale: log
  bounds: *id003
- name: Cl2e0
  path: plasma_state.radicals.Cl2_emit[0]
  scale: log
  bounds: &id004
  - 1.0e+18
  - 2.0e+19
- name: Cl2e1
  path: plasma_state.radicals.Cl2_emit[1]
  scale: log
  bounds: *id004
- name: Cl2e2
  path: plasma_state.radicals.Cl2_emit[2]
  scale: log
  bounds: *id004
parameter_groups:
- template: shell_array
  name_prefix: ne
  path: plasma_state.ne_shells_m3
  scale: log
  bounds:
  - 6.0e15
  - 5.0e16
- template: shell_array
  name_prefix: te
  path: plasma_state.te_shells_eV
  scale: linear
  bounds:
  - 1.5
  - 6.0
- template: shell_array
  name_prefix: Cl
  path: plasma_state.radicals.Cl
  scale: log
  bounds:
  - 2.0e18
  - 4.0e19
- template: shell_array
  name_prefix: Cl2e
  path: plasma_state.radicals.Cl2_emit
  scale: log
  bounds:
  - 1.0e18
  - 2.0e19
priors:
- type: log_gaussian
  path: plasma_state.metastables.Ar_1s5[0]
  mean_log10: 14.8
  sigma_log10: 0.6
