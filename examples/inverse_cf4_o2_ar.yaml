inference_mode: relative_shape

measurements:
  - instrument_id: uvvis_lowres
    files_glob: measurements/uvvis_lowres_chord_*.csv

fit:
  objective:
    spectrum_weight: 1.0
    window_fit_weight: 0.15
    window_fit_normalization: area
    window_baseline_mode: local_linear
    area_weight: 0.3
    peak_weight: 0.05
    auto_gain_fit: true
    auto_offset_fit: true
  global:
    enabled: false
    maxiter: 1
    popsize: 4
    seed: 1
  local:
    enabled: true
    max_nfev: 80
  uncertainty:
    laplace: true
  regularization:
    smooth_arrays:
      - path: plasma_state.ne_shells_m3
        order: 2
        weight: 0.05
      - path: plasma_state.te_shells_eV
        order: 2
        weight: 0.05

parameter_groups:
  - template: shell_array
    name_prefix: ne
    path: plasma_state.ne_shells_m3
    scale: log
    bounds: [5.0e15, 4.0e16]
  - template: shell_array
    name_prefix: te
    path: plasma_state.te_shells_eV
    scale: linear
    bounds: [1.2, 4.0]
